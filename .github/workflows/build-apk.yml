name: Build Shajamal APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare Debug Signing Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Core Dialer Unit Tests
        run: gradle :app:testDebugUnitTest --tests "com.example.DialerLogicTest" --no-daemon

      - name: Build Shajamal APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK for Download
        run: |
          mkdir -p build-apk
          cp app/build/outputs/apk/debug/app-debug.apk build-apk/Shajamal.apk

      - name: Upload Shajamal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shajamal-APK
          path: build-apk/Shajamal.apk
          if-no-files-found: error
          retention-days: 30
